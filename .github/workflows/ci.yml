name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: furrowcast_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          
      - name: Run migrations
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/furrowcast_test
        run: |
          cd backend
          alembic upgrade head
          
      - name: Seed database
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/furrowcast_test
        run: |
          cd backend
          python -m app.db.seed

      - name: Bootstrap NY reference data
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/furrowcast_test
        run: |
          cd backend
          python -m app.db.bootstrap

      - name: Lint
        run: |
          cd backend
          pip install ruff==0.16.3   # not in requirements.txt (see repo rule 1)
          ruff check .
          
      - name: Run tests
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/furrowcast_test
        run: |
          cd backend
          pytest
